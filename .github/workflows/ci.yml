name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Node-independent checks run once
      - if: matrix.node == 24
        run: npm run typecheck
      - if: matrix.node == 24
        run: npm run lint
      - run: npm run validate:rubric
      - if: matrix.node == 24
        run: npm run check:rubric-docs
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js --version
      # Dogfood: this repository must keep its own harness at L4.
      - run: node dist/cli.js --min-level 4 .
