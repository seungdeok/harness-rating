name: Source links

on:
  schedule:
    - cron: "17 6 1 * *" # monthly, 06:17 UTC on the 1st
  workflow_dispatch:
    inputs:
      extra_url:
        description: Extra URL to check (a broken one tests that an issue is opened)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: source-links
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      - id: check
        continue-on-error: true
        env:
          EXTRA_URL: ${{ inputs.extra_url }}
        run: node scripts/check-source-links.ts > report.md
      - run: cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # One open issue, found by label so edits to its title don't create duplicates.
        run: |
          gh label create source-links --color d93f0b \
            --description "Broken URL in rubric/sources.yaml" --force
          number=$(gh issue list --state open --label source-links --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file report.md
          else
            gh issue create --title "Broken source links" --label source-links --body-file report.md
          fi
      - name: Fail the run when links are broken
        if: steps.check.outcome == 'failure'
        run: exit 1
