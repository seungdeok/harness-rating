name: npm release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.tag.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate tag and package version
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-tag.ts
      - name: Require a release commit reachable from main
        if: steps.tag.outputs.mode == 'publish'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm install --global npm@11.20.0 --ignore-scripts
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run validate:rubric
      - run: npm run check:rubric-docs
      - run: npm run build
      - name: Pack the tested build once
        run: |
          mkdir package
          npm pack --ignore-scripts --pack-destination package
          version=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
          mv "package/harness-rating-$version.tgz" package/harness-rating.tgz
      - name: Smoke-test the installed package
        run: |
          npm install --prefix "$RUNNER_TEMP/release-smoke" ./package/harness-rating.tgz --ignore-scripts --no-audit --no-fund
          "$RUNNER_TEMP/release-smoke/node_modules/.bin/harness-rating" --version
          "$RUNNER_TEMP/release-smoke/node_modules/.bin/harness-rating" test/fixtures/levels/l4-sustained --min-level 4
      - name: Dry-run publication without publishing credentials
        run: npm publish ./package/harness-rating.tgz --dry-run --provenance --access public --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: package/harness-rating.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: needs.verify.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package
          digest-mismatch: error
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.20.0 --ignore-scripts
      # OIDC trusted publishing; publish the exact tested tarball, without lifecycle scripts.
      - run: npm publish ./package/harness-rating.tgz --provenance --access public --ignore-scripts
